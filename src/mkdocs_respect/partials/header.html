<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '' | url }}">
      <img class="brand-logo" src="{{ (config.theme.logo or 'img/logo.svg') | url }}" alt="">
      <span class="brand-name">{{ config.site_name }}</span>
    </a>

    {% include "partials/version-selector.html" %}

    {% if nav %}
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    {% endif %}

    {% if 'search' in config.plugins %}
      <button class="search-trigger" id="search-trigger" aria-label="Open search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="search-trigger-label">Search</span>
        <kbd class="search-trigger-key" data-shortcut="search">Ctrl K</kbd>
      </button>
    {% endif %}
  </div>
</header>
